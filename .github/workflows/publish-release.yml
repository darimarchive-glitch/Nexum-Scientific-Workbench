name: Publish Nexum 6.8.1 installers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-nexum-6-8-1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested revision and download installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/35101983109 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/35101983109 --jq .head_sha)" = d0a89d37c3c0fdab5a8dca887ccaefb97e492a1e
          test "$(git rev-parse c0f7cacb6df6bae48170092f5d7bcbe9ab317ae6^{tree})" = "$(git rev-parse d0a89d37c3c0fdab5a8dca887ccaefb97e492a1e^{tree})"
          test "$(gh api repos/$GH_REPO/actions/runs/35101983102 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/35101983102 --jq .head_sha)" = d0a89d37c3c0fdab5a8dca887ccaefb97e492a1e
          mkdir assets
          gh run download 35101983109 --name Nexum-Windows-installer --dir assets
          gh run download 35101983109 --name Nexum-Linux-flatpak --dir assets
          test -s assets/Nexum-Setup-6.8.1-x64.exe
          test -s assets/Nexum-x86_64.flatpak
          test -s assets/Reparar-atalho-Nexum.sh
          cd assets
          sha256sum Nexum-Setup-6.8.1-x64.exe Nexum-x86_64.flatpak Reparar-atalho-Nexum.sh > SHA256SUMS.txt
      - name: Upload all files before publishing the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id=$(gh api repos/$GH_REPO/releases --jq '.[] | select(.tag_name == "v6.8.1") | .id')
          if [ -z "$release_id" ]; then
            gh release create v6.8.1 --target c0f7cacb6df6bae48170092f5d7bcbe9ab317ae6 --draft --title 'Nexum 6.8.1' --notes-file docs/RELEASE-6.8.1.md
            for attempt in 1 2 3 4 5; do
              release_id=$(gh api repos/$GH_REPO/releases --jq '.[] | select(.tag_name == "v6.8.1") | .id')
              [ -n "$release_id" ] && break
              sleep 2
            done
          fi
          test -n "$release_id"
          echo "Validating release ID: $release_id"
          test "$(gh api repos/$GH_REPO/releases/$release_id --jq .target_commitish)" = c0f7cacb6df6bae48170092f5d7bcbe9ab317ae6
          if [ "$(gh api repos/$GH_REPO/releases/$release_id --jq .draft)" = false ]; then
            echo 'This release is already published; its files will not be replaced.'
            exit 0
          fi
          gh release upload v6.8.1 assets/Nexum-Setup-6.8.1-x64.exe assets/Nexum-x86_64.flatpak assets/Reparar-atalho-Nexum.sh assets/SHA256SUMS.txt --clobber
          test "$(gh api repos/$GH_REPO/releases/$release_id --jq '.assets | length')" = 4
          gh release edit v6.8.1 --draft=false --latest

